# CI — lint, typecheck, build, test (with coverage) and the discovery-drift
# check on every push and PR, on the self-hosted `host` runner (brett-local).
#
# The MCP server links billing-kit (`link:../billing-kit`) as its peer and reads
# billing-kit-components' registry.json for discovery, so CI clones both as
# siblings and builds billing-kit first. The runner has node (nvm), pnpm and git
# already; no external actions (there is no action registry), so checkout is a
# plain git clone with the job token. Paths are derived, not hard-coded.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a billing-kit / registry change is caught here within a day even
  # though it lives in another repo.
  schedule:
    - cron: '41 6 * * *'

jobs:
  verify:
    runs-on: host
    env:
      REQUIRE_DB: '1'
      REQUIRE_DISCOVERY_SOURCES: '1'
      # The runner's local Postgres; the harness rebuilds billing.* there from
      # billing-kit's sql/*.sql. `createdb billing_kit_test` once on the host.
      BILLING_KIT_TEST_DATABASE_URL: postgres://localhost:5432/billing_kit_test
    steps:
      - name: Put node / pnpm / psql on PATH
        run: |
          ls -d "$HOME"/.nvm/versions/node/*/bin | tail -1 >> "$GITHUB_PATH"
          if command -v brew >/dev/null 2>&1; then
            echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: Ensure the test database exists
        run: createdb billing_kit_test 2>/dev/null || true

      - name: Checkout the MCP server and its siblings
        run: |
          set -euo pipefail
          WS="$(mktemp -d)"
          echo "WS=$WS" >> "$GITHUB_ENV"
          git clone -q "http://token:${{ github.token }}@localhost:3003/${{ github.repository }}.git" "$WS/billing-kit-mcp"
          ( cd "$WS/billing-kit-mcp" && git checkout -q "${{ github.sha }}" )
          # Siblings at their latest main — billing-kit is the peer this server
          # prices with; billing-kit-components supplies registry.json.
          git clone -q --depth 1 "http://token:${{ github.token }}@localhost:3003/brett/billing-kit.git" "$WS/billing-kit"
          git clone -q --depth 1 "http://token:${{ github.token }}@localhost:3003/brett/billing-kit-components.git" "$WS/billing-kit-components"

      - name: Build billing-kit
        run: |
          cd "$WS/billing-kit"
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install, lint, typecheck, build, discovery:check, test with coverage
        run: |
          cd "$WS/billing-kit-mcp"
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm run build
          pnpm run discovery:check
          pnpm run test:coverage
